<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#D3D3D3" />
      <stop offset="50%" stop-color="#A9A9A9" />
      <stop offset="75%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#808080" />
    </linearGradient>
    <linearGradient id="darkSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9A9A9" />
      <stop offset="50%" stop-color="#808080" />
      <stop offset="100%" stop-color="#4F4F4F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer metallic ring -->
  <circle cx="100" cy="100" r="85" fill="url(#darkSilver)" stroke="url(#silver)" stroke-width="4" />
  <circle cx="100" cy="100" r="75" fill="#15161A" stroke="url(#silver)" stroke-width="1" />
  
  <!-- Text inside ring -->
  <path id="textPath" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#E8E8E8" letter-spacing="2">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">MSME ZED CERTIFICATE</textPath>
  </text>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="50" fill="url(#silver)" />
  <circle cx="100" cy="100" r="46" fill="#1E2230" />
  
  <!-- ZED text -->
  <text x="100" y="98" font-family="'Montserrat', 'Inter', sans-serif" font-size="34" font-weight="900" fill="url(#silver)" text-anchor="middle" filter="url(#glow)">Zed</text>
  <text x="100" y="122" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#C0C0C0" text-anchor="middle" letter-spacing="4">SILVER</text>
  
  <!-- Zero Defect Zero Effect -->
  <path id="bottomTextPath" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#A9A9A9" letter-spacing="1.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">ZERO DEFECT ZERO EFFECT</textPath>
  </text>
</svg>
