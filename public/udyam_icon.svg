<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33CC33" />
      <stop offset="100%" stop-color="#009900" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#D35400" />
    </linearGradient>
  </defs>
  <!-- Outer border -->
  <circle cx="100" cy="100" r="85" fill="#15161A" stroke="url(#gold)" stroke-width="3" />
  
  <!-- Tricolor ring -->
  <circle cx="100" cy="100" r="80" stroke="url(#saffron)" stroke-width="2" stroke-dasharray="125 250" fill="none" transform="rotate(-90 100 100)" />
  <circle cx="100" cy="100" r="80" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="125 250" fill="none" transform="rotate(30 100 100)" opacity="0.3" />
  <circle cx="100" cy="100" r="80" stroke="url(#green)" stroke-width="2" stroke-dasharray="125 250" fill="none" transform="rotate(150 100 100)" />

  <!-- Outer text path -->
  <path id="udyamTextPath" d="M 32,100 A 68,68 0 0,1 168,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#FF9933" letter-spacing="2">
    <textPath href="#udyamTextPath" startOffset="50%" text-anchor="middle">UDYAM REGISTRATION</textPath>
  </text>

  <!-- Gear wheel in the center -->
  <g transform="translate(100,105)">
    <!-- Gear teeth -->
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(0)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(30)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(60)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(90)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(120)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(150)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(180)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(210)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(240)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(270)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(300)" />
    <path d="M-8,-38 L8,-38 L12,-28 L-12,-28 Z" fill="url(#gold)" transform="rotate(330)" />
    
    <!-- Central circles -->
    <circle cx="0" cy="0" r="30" fill="url(#gold)" />
    <circle cx="0" cy="0" r="22" fill="#15161A" />
    <circle cx="0" cy="0" r="10" fill="url(#gold)" />
    <circle cx="0" cy="0" r="5" fill="#15161A" />
  </g>

  <!-- Bottom text: GOVERNMENT OF INDIA -->
  <path id="govTextPath" d="M 168,100 A 68,68 0 0,1 32,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#00CC44" letter-spacing="1">
    <textPath href="#govTextPath" startOffset="50%" text-anchor="middle">GOVERNMENT OF INDIA</textPath>
  </text>
</svg>
